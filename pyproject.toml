[tool.poetry]
name = "hello_world"
version = "0.1"
description = "API boilerplate"
authors = ["Krijn van der Burg"]
readme = "README.md"
packages = [{ include = "hello_world", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
structlog = "^25.4.0"
pydantic = "^2.11.9"
pydantic-settings = "^2.8.0"
pydantic-extra-types = "^2.0"
email-validator = "^2.0"
# FastAPI
fastapi = "^0.124.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
python-multipart = "^0.0.9"
# Database
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
greenlet = "^3.1.1"

[tool.poetry.group.test.dependencies]
pre_commit = "*"
pytest = ">=8.3.0"
pytest-cov = ">=2.0.0"
pytest-xdist = ">=3.6.1"
httpx = "^0.27.0"
pytest-asyncio = "^0.24.0"
testcontainers = { extras = ["postgres"], version = "^4.8.2" }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
