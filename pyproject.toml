[tool.poetry]
name = "hello_world"
version = "0.1"
description = "API boilerplate"
authors = ["Krijn van der Burg"]
readme = "README.md"
packages = [{ include = "hello_world", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
structlog = "^25.4.0"
pydantic = "^2.11.9"
pydantic-settings = "^2.8.0"

# OpenTelemetry core packages - using compatible versions
opentelemetry-api = "^1.37.0"
opentelemetry-sdk = "^1.37.0"
opentelemetry-exporter-otlp = "^1.37.0"

[tool.poetry.group.test.dependencies]
pre_commit = "*"
pytest = ">=8.3.0"
pytest-cov = ">=2.0.0"
pytest-xdist = ">=3.6.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
