[tool.poetry]
name = "hello_world"
version = "0.1"
description = "API boilerplate"
authors = ["Krijn van der Burg"]
readme = "README.md"
packages = [{ include = "hello_world", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
structlog = "^25.4.0"
pydantic = "^2.11.9"
pydantic-settings = "^2.8.0"
pydantic-extra-types = "^2.0"
email-validator = "^2.0"

# FastAPI
fastapi = "^0.124.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
python-multipart = "^0.0.9"

[tool.poetry.group.test.dependencies]
pre_commit = "*"
pytest = ">=8.3.0"
pytest-cov = ">=2.0.0"
pytest-xdist = ">=3.6.1"
httpx = "^0.27.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# FastAPI best practice: Use ruff for linting and formatting
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Enable comprehensive rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "PLR0913", # too many arguments to function call
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "PT", "S101"]  # Allow fixtures, asserts in tests
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=hello_world",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

